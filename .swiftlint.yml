included:
  - App
  - Widget
  - Packages

excluded:
  - Packages/*/.build
  - "**/.build"

disabled_rules:
  - todo
  # Conflicts with .swiftformat's `--commas always`, which requires a
  # trailing comma on the last element of a multi-line collection
  # literal. SwiftLint's default here forbids exactly what SwiftFormat
  # enforces — keeping SwiftFormat's convention since it already ran
  # across the whole tree.
  - trailing_comma
  # Conflicts with SwiftFormat's wrapMultilineStatementBraces: when a
  # guard/if condition spans multiple lines, SwiftFormat puts the
  # opening brace (or `else {`) on its own line rather than trailing
  # the last condition, which is exactly what this rule forbids.
  - opening_brace

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init

line_length:
  warning: 120
  error: 160

# Conventional short names (loop indices, weight arrays, deltas in test
# math) read better than forced long ones here — min_length still
# catches genuinely unclear single-letter names elsewhere.
identifier_name:
  min_length: 2
  excluded:
    - i
    - j
    - w
    - a
    - b
    - c
    - d
    - x
    - y

# SleepDebtEngine.snapshot() legitimately assembles a full DebtSnapshot
# from several independent pieces (trend, break-even, both deltas) —
# the default 50-line threshold is conservative for that; still capped
# well short of "needs splitting." `swiftlint lint --strict` fails on
# warnings too, so the warning threshold needs real headroom above the
# current body (71 lines), not just the error ceiling.
function_body_length:
  warning: 90
  error: 130

# SleepDebtEngineTests.swift is P1's most heavily fixture-tested file by
# design (docs/IMPLEMENTATION_PLAN.md's "fully unit tested" goal) — a
# long, thorough test file here is the point, not a code smell. Warning
# thresholds need headroom above the current file (587 lines / 451-line
# class body) since --strict fails on warnings, not just errors.
file_length:
  warning: 700
  error: 900

# SleepDebtEngineTests.swift's class body has grown past the default
# 500-line warning threshold along with the file itself (see
# file_length's note just above) — same rationale, same file. Warning
# needs real headroom above the current body (514 lines, excluding
# comments/whitespace) since --strict fails on warnings too.
type_body_length:
  warning: 600
  error: 750

# RefreshCoordinator.refresh() ties together the calendar/clock inputs
# (referenceDate, now, calendar), the D8 need-change flag, and the three
# collaborators it's tested against fakes for (source, store, reloader) —
# each is independently meaningful and independently faked in tests;
# bundling them into a parameter object would just move the same count
# into a struct literal at every call site. Default warning is 5
# (ignoring needChangedToday's default value, this function has 7).
function_parameter_count:
  warning: 8
  error: 10
