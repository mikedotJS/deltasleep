name: CI

on:
  # No branch filter yet — everything currently happens on one long-lived
  # feature branch, not via PRs into main. Narrow this to `branches: [main]`
  # plus `pull_request:` once that changes.
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test SleepDebtCore (pure Swift, no Apple frameworks)
        run: swift test --package-path Packages/SleepDebtCore

      - name: Test HealthSleepSource
        run: swift test --package-path Packages/HealthSleepSource

      - name: Test SnapshotStore
        run: swift test --package-path Packages/SnapshotStore

      - name: Test GlassKit
        run: swift test --package-path Packages/GlassKit

      - name: Build app + widget for iOS Simulator
        run: |
          xcodebuild build \
            -project DeltaSleep.xcodeproj \
            -scheme DeltaSleep \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # The step above only ever compiles Debug against the Simulator SDK
      # — release-testflight.yml's real archive uses Release against the
      # device SDK, a combination nothing here has ever compiled before
      # this step existed. Unsigned, since no Apple Developer credentials
      # exist in this CI (see release-testflight.yml for the signed
      # version) — this can't catch a signing/provisioning problem, but
      # it does catch a Release-only or device-SDK-only compile error,
      # for free, before anyone spends a real App Store Connect upload
      # attempt finding it instead.
      - name: Archive app + widget for iOS device (unsigned, Release config)
        run: |
          xcodebuild archive \
            -project DeltaSleep.xcodeproj \
            -scheme DeltaSleep \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DeltaSleep.xcarchive \
            CODE_SIGNING_ALLOWED=NO

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (check only)
        run: swiftformat App Widget Packages --lint

      - name: SwiftLint
        # No path args here — swiftlint's `lint` doesn't take bare positional
        # paths; scope comes from .swiftlint.yml's `included:` instead.
        run: swiftlint lint --strict
